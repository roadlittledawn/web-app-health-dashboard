[build]
  command = "npm run build"
  publish = "/web/.next"

[dev]
  command = "cd \"$(git rev-parse --show-toplevel)/web\" && next dev"

[functions]
  directory = "/web/netlify/functions"
  node_bundler = "esbuild"

# Old production host -> the clang-auth domain. The sign-in cookie can't reach
# *.netlify.app, so the old host would be a dead end. Matching the exact host
# leaves deploy previews (deploy-preview-N--clang-health.netlify.app) alone.
[[redirects]]
  from = "https://clang-health.netlify.app/*"
  to = "https://health.clintonlangosch.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Security headers for API routes
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
